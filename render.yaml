# Proposed service definition; create/connect the Render project manually.
services:
  - type: web
    name: wastegrid-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MESSAGING_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_PHOTO_BUCKET
        value: report-photos
  - type: worker
    name: wastegrid-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m api.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PHOTO_BUCKET
        value: report-photos
      - key: PERSON3_BASE_URL
        sync: false
      - key: PERSON3_API_KEY
        sync: false
      - key: CHALK_ROUTER_API_KEY
        sync: false
      - key: CHALK_ENV_ID
        sync: false
      - key: CHALK_MODEL
        value: groq/qwen/qwen3.8-27b
      - key: CHALK_ROUTER_BASE_URL
        value: https://api.chalk.ai/v1/router
      - key: ASSESSMENT_TIMEOUT_SECONDS
        value: "30"
