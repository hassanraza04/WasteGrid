# API-only shared development deployment. See docs/backend/shared-development-api.md.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: wastegrid-api-dev
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MESSAGING_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_PHOTO_BUCKET
        value: report-photos
      - key: ORGANIZER_ROUTING_ENABLED
        value: "true"
      - key: MESSAGING_PILOT_ENABLED
        value: "false"
      - key: ROUTING_OSRM_BASE_URL
        value: https://routing.openstreetmap.de/routed-car
      - key: ROUTING_PROVIDER_TIMEOUT_SECONDS
        value: "10"
